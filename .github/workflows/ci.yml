# Prüft bei jedem Push/PR alles, was sich ohne Hardware prüfen lässt:
#  - firmware: Badge (Release + Debug), Basisstation und Bridge kompilieren
#  - flash-tooling: pytest für scripts/flashlib
#  - app: mix test für herz_schwarm_nerves (Host-Target, kein Nerves-Build)
# Geflasht wird hier nichts; Funk- und LED-Verhalten bleibt ein Test am Gerät.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dieselben Versionen wie beim lokalen Build; bewusst festgenagelt, damit ein neuer
  # ESP32-Core oder eine neue Library den Build nicht unbemerkt verändert.
  ESP32_CORE_VERSION: "3.3.12"
  FASTLED_VERSION: "3.10.9"
  PUBSUBCLIENT_VERSION: "2.8.0"
  ARDUINOJSON_VERSION: "7.4.3"

jobs:
  firmware:
    name: Firmware kompilieren
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32-Core und Libraries aus dem Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-${{ env.ESP32_CORE_VERSION }}-fastled-${{ env.FASTLED_VERSION }}-pubsub-${{ env.PUBSUBCLIENT_VERSION }}-json-${{ env.ARDUINOJSON_VERSION }}

      - name: ESP32-Core und Libraries installieren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          arduino-cli lib install \
            "FastLED@${FASTLED_VERSION}" \
            "PubSubClient@${PUBSUBCLIENT_VERSION}" \
            "ArduinoJson@${ARDUINOJSON_VERSION}"

      # Der Sketch-Ordner muss wie die .ino heißen: die Badge-Firmware liegt in der
      # Repo-Wurzel, der Checkout-Ordner heißt wie das Repo (Herz_Schwarm_CCC_V).
      - name: Badge (Release)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --build-path "$RUNNER_TEMP/build/badge" .

      - name: Badge (Debug, Serial-Log)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --board-options CDCOnBoot=cdc \
            --build-property "compiler.cpp.extra_flags=-DENABLE_SERIAL_DEBUG=1" \
            --build-path "$RUNNER_TEMP/build/badge_debug" .

      # Das Funk-Update wird nur mit ota_secret.h mitkompiliert. Hier mit der Vorlage bauen,
      # damit auch dieser Code geprüft ist — die Binärdatei enthält die öffentlichen
      # Beispielwerte und wird deshalb nicht als Artefakt abgelegt.
      - name: Badge (mit Funk-Update, Beispiel-Schlüssel)
        run: |
          cp ota_secret.h.example ota_secret.h
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --build-path "$RUNNER_TEMP/build/badge_ota" .
          rm ota_secret.h

      # Basisstation und Bridge nehmen ihre Board-Optionen aus der jeweiligen sketch.yaml.
      # Die Basisstation baut ohne ota_secret.h mit dem Standard-OTA-Passwort — die
      # Binärdatei aus der CI deshalb nicht auf eine echte Station flashen.
      - name: Basisstation
        run: |
          arduino-cli compile --build-path "$RUNNER_TEMP/build/basestation" \
            Herz_Schwarm_BaseStation

      - name: Bridge
        run: |
          arduino-cli compile --build-path "$RUNNER_TEMP/build/bridge" \
            herz_schwarm_nerves/firmware/esp32_bridge

      - name: Badge- und Bridge-Firmware als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build/badge/*.ino.bin
            ${{ runner.temp }}/build/bridge/*.ino.bin
          if-no-files-found: error
          retention-days: 30

  flash-tooling:
    name: Flash-Tooling (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: python -m pip install --upgrade pytest pyserial

      - name: Tests
        run: python -m pytest scripts -q

  app:
    name: App (mix test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: herz_schwarm_nerves
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      # Elixir/OTP wie in herz_schwarm_nerves/.tool-versions
      - uses: erlef/setup-beam@v1
        with:
          version-file: herz_schwarm_nerves/.tool-versions
          version-type: strict

      - name: Deps und Build aus dem Cache
        uses: actions/cache@v4
        with:
          path: |
            herz_schwarm_nerves/deps
            herz_schwarm_nerves/_build
          key: mix-${{ runner.os }}-${{ hashFiles('herz_schwarm_nerves/.tool-versions', 'herz_schwarm_nerves/mix.lock') }}

      # mix.exs deklariert nerves_bootstrap als Archiv; ohne das bricht jeder mix-Aufruf ab.
      # MIX_TARGET bleibt ungesetzt (host): kein Nerves-Build, kein Cross-Compile.
      - name: Hex, Rebar und nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex nerves_bootstrap "~> 1.13" --force

      - name: Abhängigkeiten
        run: mix deps.get

      - name: Tests
        run: mix test
